Menlo,monospace" font-size="14" fill="#f7e9eb">LLM Integration &amp; RAG Architectures</text><text x="38" y="414" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#ff2d46">▸</text><text x="60" y="414" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#f7e9eb">Autonomous AI Agents &amp; Multi-Agent Frameworks</text><text x="38" y="444" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#ff2d46">▸</text><text x="60" y="444" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#f7e9eb">Voice-Driven AI Applications</text><text x="38" y="474" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#ff2d46">▸</text><text x="60" y="474" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#f7e9eb">Computer Vision Solutions</text><text x="38" y="504" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="700" fill="#ff2d46">▸</text><text x="60" y="504" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" fill="#f7e9eb">MLOps, Experiment Tracking &amp; Developer Tooling</text><line x1="38" y1="538" x2="842" y2="538" stroke="#5c0a16" stroke-width="2"/><text x="38" y="570" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#a8838a">Islamabad, Pakistan · 5 followers · 19 repositories · ★ 5 stars</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
